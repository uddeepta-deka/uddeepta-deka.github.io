<footer class="footer-main">
    {{ site.title }} © {{ site.time | date: '%Y' }}

    <a class="link" href="{{ site.url }}/feed.xml" target="_blank">
        <i class="fa-solid fa-rss"></i>
    </a>

        <!-- Theme toggle: toggles [data-theme="dark"] on <html> -->
        <button id="theme-toggle" class="link" aria-label="Toggle theme" title="Toggle dark / light" style="margin-left:0.6rem;border:none;background:transparent;cursor:pointer;font-size:1rem">
                <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
        </button>

</footer>

<script>
// Theme toggle script: persists choice in localStorage as 'site-theme'
(function(){
    var btn = document.getElementById('theme-toggle');
    var icon = document.getElementById('theme-toggle-icon');
    if(!btn || !icon) return;

    function setDark(enabled){
        if(enabled){
            document.documentElement.setAttribute('data-theme','dark');
            icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
        } else {
            document.documentElement.removeAttribute('data-theme');
            icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        }
        try{ localStorage.setItem('site-theme', enabled ? 'dark' : 'light'); }catch(e){}
    }

    // initialize from saved preference
    try{
        var saved = localStorage.getItem('site-theme');
        if(saved === 'dark') setDark(true);
        else if(saved === 'light') setDark(false);
        else {
            // no explicit choice: reflect system preference
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            setDark(prefersDark);
        }
    }catch(e){ }

    btn.addEventListener('click', function(){
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        setDark(!isDark);
    });
})();
</script>
