<!-- Enhanced SEO Meta Tags -->
<!-- This file provides comprehensive SEO, Open Graph, and Twitter Card meta tags -->

<!-- Basic SEO -->
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta name="keywords" content="{% if page.keywords %}{{ page.keywords }}{% else %}{{ site.keywords }}{% endif %}">
<meta name="author" content="{{ site.author }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - {{ site.bio }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif site.og_image %}{{ site.og_image | absolute_url }}{% else %}{{ site.picture | absolute_url }}{% endif %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="{{ site.locale | default: 'en_US' }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="{{ site.twitter.card | default: 'summary_large_image' }}">
<meta name="twitter:site" content="@{{ site.twitter.username }}">
<meta name="twitter:creator" content="@{{ site.twitter.username }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% elsif site.og_image %}{{ site.og_image | absolute_url }}{% else %}{{ site.picture | absolute_url }}{% endif %}">

<!-- LinkedIn -->
<meta property="article:author" content="{{ site.linkedin | prepend: 'https://www.linkedin.com/in/' }}">

<!-- Additional SEO -->
<meta name="theme-color" content="#2563eb">
<meta name="msapplication-TileColor" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="application-name" content="{{ site.title }}">

<!-- Language -->
<meta http-equiv="content-language" content="en">
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">

<!-- JSON-LD Structured Data for Person/Researcher -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "image": "{{ site.picture | absolute_url }}",
  "jobTitle": "Physicist",
  "description": "{{ site.bio }}",
  "alumniOf": {
    "@type": "Organization",
    "name": "International Centre for Theoretical Sciences (ICTS-TIFR)"
  },
  "knowsAbout": [
    "Gravitational Wave Astrophysics",
    "Gravitational Lensing",
    "Microlensing",
    "Black Hole Physics",
    "Computational Physics",
    "Data Analysis"
  ],
  "email": "{{ site.email }}",
  "sameAs": [
    "https://twitter.com/{{ site.twitter }}",
    "https://www.linkedin.com/in/{{ site.linkedin }}",
    "https://github.com/{{ site.github }}",
    "https://scholar.google.com/citations?{{ site.scholar }}",
    "{{ site.inspirehep }}",
    "https://www.facebook.com/{{ site.facebook }}"
  ]
}
</script>

<!-- Preconnect for Performance -->
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<link rel="dns-prefetch" href="//kit.fontawesome.com">
