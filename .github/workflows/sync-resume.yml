name: Sync latest resume

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-latest-resume
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download the newest CV release
        id: resume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/resume
          curl --fail --location --retry 3 \
            --output /tmp/resume.pdf \
            https://github.com/uddeepta-deka/my_CV/releases/latest/download/resume.pdf
          test "$(head -c 5 /tmp/resume.pdf)" = "%PDF-"

          if cmp --silent /tmp/resume.pdf assets/resume/resume.pdf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv /tmp/resume.pdf assets/resume/resume.pdf
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the updated PDF
        if: steps.resume.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resume/resume.pdf
          git commit -m "chore: sync latest resume"
          git push origin HEAD:gh-pages

      - name: Rebuild GitHub Pages
        if: steps.resume.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
